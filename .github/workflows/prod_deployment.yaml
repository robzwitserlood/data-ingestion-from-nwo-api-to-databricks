# This workflow validates, deploys, and runs the specified bundle
# within a production target named "prod".
name: 'Production deployment'

permissions:
  contents: read

# Ensure that only a single job or workflow using the same concurrency group
# runs at a time.
concurrency:
  group: prod-deployment
  cancel-in-progress: true

# Trigger this workflow whenever a pull request is pushed to the repo's
# main branch.
on:
  push:
    branches:
      - main

env:
  # Databricks Free Edition has no account console / account-level APIs, so
  # GitHub OIDC + service-principal federation (workload identity) is not
  # available here. Authenticate instead with a PAT stored as a GitHub Actions
  # secret (see the personal access token constitution principle). Create the
  # secret DATABRICKS_TOKEN in this repo's settings before this workflow can run.
  DATABRICKS_HOST: https://dbc-122f0c0d-dc6f.cloud.databricks.com
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  DATABRICKS_BUNDLE_ENV: prod

jobs:
  deploy:
    name: 'Deploy bundle'
    runs-on: ubuntu-latest

    steps:
      # Check out this repo, so that this workflow can access it.
      - uses: actions/checkout@v3

      # Download the Databricks CLI.
      # See https://github.com/databricks/setup-cli
      - uses: databricks/setup-cli@main

      # Deploy the bundle to the "prod" target as defined
      # in the bundle's settings file.
      - run: databricks bundle deploy
        working-directory: .

  # Validate, deploy, and then run the bundle.
  pipeline_update:
    name: 'Run pipeline update'
    runs-on: ubuntu-latest

    # Run the "deploy" job first.
    needs:
      - deploy

    steps:
      # Check out this repo, so that this workflow can access it.
      - uses: actions/checkout@v3

      # Use the downloaded Databricks CLI.
      - uses: databricks/setup-cli@main

      # Run the Databricks workflow named "data_nwo_ingestion_pipeline_job" as defined in the
      # bundle that was just deployed.
      - run: databricks bundle run data_nwo_ingestion_pipeline_job --refresh-all
        working-directory: .