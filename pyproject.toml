[project]
name = "data_nwo_ingestion_pipeline"
version = "0.0.1"
authors = [{ name = "Rob Zwitserlood" }]
requires-python = ">=3.10,<=3.13"

[dependency-groups]
dev = [
    "pytest",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = [
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_nwo_ingestion_pipeline"]

[project.scripts]
main = "data_nwo_ingestion_pipeline.main:main"
